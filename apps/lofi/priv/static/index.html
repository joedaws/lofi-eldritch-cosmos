<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lofi Eldritch Cosmos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital@1&display=swap">
<style>
  /* An old beige-box workstation running an occult simulation:
     putty windows with ink borders, hard shadows and pinstriped title bars
     over a deep verdigris-black void. One deliberate look, light panels on a dark map. */
  :root {
    --void: #071012;          /* behind the map */
    --putty: #d6cdb6;         /* window body */
    --putty-2: #c4b99d;       /* insets, wells */
    --putty-3: #e6dfcb;       /* raised highlights, inputs */
    --ink: #17130e;           /* borders, text */
    --muted: #5d5446;
    --faint: #8d826d;
    --accent: #7c1d2a;        /* oxblood */
    --accent-2: #1d5c58;      /* verdigris, links */
    --warn: #a87211;          /* mustard */
    --danger: #a3242f;
    --good: #2f6b3b;
    --text: var(--ink);
    --pixel: "VT323", "Courier New", monospace;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: "IBM Plex Serif", Georgia, serif;   /* thoughts and incantations */
    --ui: var(--mono);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink); font-family: var(--mono); font-size: 13px; }
  body { display: grid; grid-template-columns: 1fr 392px; grid-template-rows: 100%; overflow: hidden; }
  #stage { position: relative; min-width: 0; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  canvas.beckoning { cursor: crosshair; }

  /* the window */
  aside { background: var(--putty); border-left: 2px solid var(--ink); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  header { padding: 0 0 12px; border-bottom: 2px solid var(--ink); background: var(--putty); }
  h1.titlebar { margin: 0 0 12px; padding: 5px 10px; font: 400 22px/1 var(--pixel); letter-spacing: 1px; text-align: center;
    background: repeating-linear-gradient(to bottom, var(--ink) 0 1px, transparent 1px 3px) center / 100% 13px no-repeat, var(--putty);
    border-bottom: 2px solid var(--ink); }
  h1.titlebar span { background: var(--putty); padding: 0 10px; }
  header > :not(h1) { margin-left: 14px; margin-right: 14px; }
  h2 { font: 400 26px/1.05 var(--pixel); margin: 0; letter-spacing: .5px; }
  h3 { font: 400 17px/1 var(--pixel); text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin: 14px 0 6px; }
  h3::before { content: "▚ "; color: var(--accent); }

  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: 500 12.5px var(--mono); color: var(--ink); background: var(--putty); border: 1px solid var(--ink); border-radius: 0; padding: 5px 11px; cursor: pointer;
    box-shadow: inset 1px 1px 0 var(--putty-3), inset -1px -1px 0 var(--faint), 2px 2px 0 var(--ink); }
  button:hover { background: var(--putty-3); }
  button:active { box-shadow: inset 1px 1px 0 var(--faint), inset -1px -1px 0 var(--putty-3); transform: translate(2px, 2px); }
  button:focus-visible, input:focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; }
  button.primary { background: var(--ink); color: var(--putty-3); box-shadow: 2px 2px 0 var(--accent); }
  button.primary:hover { background: var(--accent); }
  button.danger:hover { color: var(--danger); }
  button:disabled { opacity: .45; cursor: default; }
  input[type=text], input[type=number] { font: 13px var(--mono); color: var(--ink); background: var(--putty-3); border: 1px solid var(--ink); border-radius: 0; padding: 5px 7px; width: 100%;
    box-shadow: inset 2px 2px 0 var(--putty-2); }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 80px; height: 18px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--ink); }
  input[type=range]::-moz-range-track { height: 4px; background: var(--ink); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 18px; margin-top: -7px; background: var(--putty-3); border: 1px solid var(--ink); border-radius: 0; box-shadow: 2px 2px 0 var(--ink); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 18px; background: var(--putty-3); border: 1px solid var(--ink); border-radius: 0; }
  .speed { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); font-size: 11.5px; }
  #speed-label { font-family: var(--pixel) !important; font-size: 17px; color: var(--ink); }

  /* LCD-ish counters */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .stat { background: #1e2a22; color: #b9d9a3; border: 1px solid var(--ink); padding: 3px 7px 1px; box-shadow: inset 2px 2px 0 #0d130f; }
  .stat b { display: block; font: 400 26px/1 var(--pixel); font-variant-numeric: tabular-nums; }
  .stat small { font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.2px; color: #7fa06c; }

  #scroll { overflow-y: auto; flex: 1; padding: 0 14px 18px; }
  #scroll::-webkit-scrollbar { width: 14px; }
  #scroll::-webkit-scrollbar-track { background: var(--putty-2); border-left: 1px solid var(--ink); }
  #scroll::-webkit-scrollbar-thumb { background: var(--putty); border: 1px solid var(--ink); box-shadow: inset 1px 1px 0 var(--putty-3); }
  .empty { color: var(--faint); font-style: italic; padding: 4px 0; }
  .card { background: var(--putty-3); border: 1px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 12px; margin-top: 14px; }
  .card.notice { background: #e9d9a8; }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 2px 0; border-bottom: 1px dotted var(--faint); }
  .row span:first-child { color: var(--muted); }

  /* segmented meters */
  .bar { height: 10px; background: var(--putty-2); border: 1px solid var(--ink); margin: 4px 0 8px; padding: 1px; }
  .bar i { display: block; height: 100%; transition: width .4s;
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 7px); mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 7px); }
  .thought { font-family: var(--sans); font-style: italic; font-size: 14px; color: var(--ink); margin: 8px 0; line-height: 1.45; border-left: 3px double var(--ink); padding-left: 9px; }

  /* square tags instead of pills */
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 11.5px; background: var(--putty); border: 1px solid var(--ink); border-radius: 0; padding: 1px 6px; display: inline-flex; gap: 5px; align-items: center; }
  .chip .dot { width: 8px; height: 8px; border: 1px solid var(--ink); border-radius: 0; display: inline-block; }
  .chip.desire { background: var(--ink); color: var(--putty-3); }
  .link { color: var(--accent-2); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
  .link:hover { background: var(--accent-2); color: var(--putty-3); text-decoration: none; }
  .incantation { border: 1px solid var(--ink); background: var(--putty); padding: 8px 10px; margin-top: 6px; font-family: var(--sans); font-style: italic; font-size: 16px; }
  .incantation.awaiting { background: #f0dc8f; box-shadow: 3px 3px 0 var(--warn); }
  .recall { display: flex; gap: 8px; margin-top: 10px; }
  .recall input { flex: 1; }
  .feedback { font-size: 12px; margin-top: 6px; }
  .feedback.good { color: var(--good); } .feedback.bad { color: var(--danger); }

  /* the chronicle reads like a printout */
  .events { list-style: none; padding: 0; margin: 0; background: var(--putty-3); border: 1px solid var(--ink); border-top: 0; }
  .events li { padding: 6px 9px; border-bottom: 1px dashed var(--faint); font-size: 12px; line-height: 1.4; }
  .events li:last-child { border-bottom: 0; }
  .events li[data-being]:hover { background: var(--putty); }
  .events li .k { font: 400 15px/1 var(--pixel); text-transform: uppercase; letter-spacing: .8px; margin-right: 6px; color: var(--muted); }
  .events li .k::before { content: "["; } .events li .k::after { content: "]"; }
  .events li.summon .k, .events li.revive .k, .events li.working_through .k { color: var(--good); }
  .events li.fade .k, .events li.rivalry .k, .events li.trauma .k, .events li.anxiety .k, .events li.refusal .k { color: var(--danger); }
  .events li.gift .k, .events li.succor .k { color: var(--accent-2); }
  .events li.whisper .k, .events li.knot .k { color: var(--warn); }
  .events li.desire .k, .events li.elder .k, .events li.identify .k { color: var(--accent); }
  .whispers li { display: flex; justify-content: space-between; gap: 8px; }

  /* folder tabs */
  .tabs { display: flex; gap: 0; margin-top: 18px; border-bottom: 1px solid var(--ink); }
  .tabs button { flex: 1; font-size: 11.5px; padding: 5px 4px 4px; box-shadow: none; border-bottom: 0; margin-right: -1px; background: var(--putty-2); transform: none; }
  .tabs button.on { background: var(--putty-3); color: var(--ink); font-weight: 600; position: relative; top: 1px; border-color: var(--ink); }

  /* small windows floating over the map */
  .legend, .tooltip, .banner, .hint { font-family: var(--mono); }
  .legend { position: absolute; left: 12px; bottom: 12px; background: var(--putty); border: 1px solid var(--ink); box-shadow: 3px 3px 0 #000; padding: 6px 8px; font-size: 11px; max-width: calc(100% - 24px); }
  .legend .chips { gap: 3px 10px; }
  .legend .chip { background: none; border: 0; padding: 0; color: var(--ink); }
  .hint { position: absolute; top: 10px; left: 12px; color: #8fa39a; font-size: 11px; pointer-events: none; }
  .tooltip { position: absolute; pointer-events: none; background: var(--putty-3); border: 1px solid var(--ink); box-shadow: 2px 2px 0 #000; padding: 4px 7px; font-size: 11.5px; white-space: nowrap; transform: translate(12px, 12px); display: none; }
  .banner { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #f0dc8f; color: var(--ink); border: 1px solid var(--ink); box-shadow: 3px 3px 0 #000; padding: 5px 12px; font-size: 12px; font-weight: 600; display: none; }
  .overlay { position: absolute; inset: 0; display: none; place-items: center;
    background: repeating-conic-gradient(#0b1719 0 25%, #071012 0 50%) 0 0 / 4px 4px; }
  .overlay .card { max-width: 380px; width: calc(100% - 32px); text-align: left; box-shadow: 5px 5px 0 #000; }
  .overlay p { color: var(--muted); line-height: 1.5; }
  .form-grid { display: grid; gap: 6px; margin-top: 8px; }
  .form-grid label { font-size: 11.5px; color: var(--muted); }
  .error { color: var(--danger); font-size: 12px; margin-top: 6px; }

  .scrub { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 11.5px; }
  .scrub input { flex: 1; }
  .scrub span { font-family: var(--pixel); font-size: 16px; min-width: 96px; text-align: right; color: var(--ink); }
  .notice a { color: var(--accent-2); }
  .other { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
  .reason { font-size: 11.5px; color: var(--muted); font-style: italic; text-align: right; margin: 2px 0 4px; }
  .registers { display: grid; grid-template-columns: 76px 1fr 38px; gap: 2px 8px; align-items: center; font-size: 11.5px; }
  .registers .bar { margin: 2px 0; }
  .registers .loose { color: var(--warn); font-weight: 600; }
  .chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11.5px; color: var(--faint); }

  .account { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin-top: -4px; margin-bottom: 10px; font-size: 11.5px; color: var(--muted); }
  .account b { font: 400 17px/1 var(--pixel); color: var(--ink); margin-right: auto; }
  .account a, .account .linkish { color: var(--accent-2); background: none; border: 0; box-shadow: none; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
  .account a:hover, .account .linkish:hover { background: var(--accent-2); color: var(--putty-3); transform: none; }
  .admin-only[hidden], .signed-in-only[hidden] { display: none !important; }
  .temper { display: grid; grid-template-columns: 92px 1fr 30px; gap: 4px 8px; align-items: center; font-size: 11.5px; }
  .temper output { font: 400 17px/1 var(--pixel); text-align: right; }
  .temper small { grid-column: 2 / -1; color: var(--faint); margin-top: -4px; font-size: 10.5px; }
  .deck { list-style: none; margin: 0; padding: 0; border: 1px solid var(--ink); background: var(--putty); }
  .deck li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 8px; border-bottom: 1px dashed var(--faint); font-size: 12px; }
  .deck li:last-child { border-bottom: 0; }
  .deck .front { font-family: var(--sans); font-style: italic; font-size: 13.5px; }
  .deck .back { color: var(--muted); grid-column: 1; }
  .deck .meta { color: var(--faint); font-size: 11px; grid-column: 1; }
  .deck .acts { grid-row: 1 / span 3; grid-column: 2; display: flex; flex-direction: column; gap: 4px; align-self: start; }
  .deck .acts button { padding: 2px 7px; font-size: 11px; }
  .deck li.awaiting { background: #f0dc8f; }
  .mine-mark { color: var(--accent); font-weight: 600; }
  .journal { list-style: none; margin: 0; padding: 0; border: 1px solid var(--ink); background: var(--putty-3); font-size: 11.5px; }
  .journal li { padding: 4px 8px; border-bottom: 1px dashed var(--faint); display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .journal li:last-child { border-bottom: 0; }
  .journal .when { color: var(--faint); white-space: nowrap; }
  .journal .ok { color: var(--good); } .journal .miss { color: var(--danger); }
  .accuracy { display: grid; grid-template-columns: 1fr 64px 44px; gap: 3px 8px; align-items: center; font-size: 11.5px; }
  .accuracy .front { font-family: var(--sans); font-style: italic; font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .accuracy .bar { margin: 0; }
  @media (max-width: 820px) {
    body { grid-template-columns: 100%; grid-template-rows: 55vh 45vh; }
    aside { border-left: 0; border-top: 2px solid var(--ink); }
    .legend { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } button:active { transform: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cosmos"></canvas>
  <div class="hint">drag to pan · scroll to zoom · click a being (the eye follows it) or a place</div>
  <div class="banner" id="banner"></div>
  <div class="tooltip" id="tooltip"></div>
  <div class="legend" id="legend"></div>
  <div class="overlay" id="genesis">
    <div class="card">
      <h2>The void is empty</h2>
      <p>Dream a landscape of haunted places into being and awaken beings to roam it.</p>
      <div class="form-grid">
        <label for="seed-beings">Beings to awaken</label>
        <input type="number" id="seed-beings" value="14" min="1" max="60">
        <label for="seed-rings">Places on each ring (inner → outer)</label>
        <input type="text" id="seed-rings" value="6, 10, 14">
      </div>
      <div class="controls" style="justify-content:center;margin-top:12px">
        <button class="primary" id="seed-go">Begin genesis</button>
        <button id="seed-cancel">Cancel</button>
      </div>
      <div class="error" id="seed-error"></div>
    </div>
  </div>
</div>
<aside>
  <header>
    <h1 class="titlebar"><span>Lofi Eldritch Cosmos</span></h1>
    <div class="account" id="account"></div>
    <div class="controls">
      <button class="primary admin-only" id="toggle" hidden>▶ Stir</button>
      <button class="admin-only" id="new-cosmos" title="Unmake this cosmos and seed a new one" hidden>New cosmos</button>
      <button id="bonds-toggle" title="Show strong bonds between all beings">Bonds</button>
    </div>
    <div class="speed admin-only" id="speed-row" hidden>
      <span>slow</span>
      <input type="range" id="speed" min="100" max="3000" step="50" value="1000" aria-label="Tick duration">
      <span>fast</span>
      <span id="speed-label" style="min-width:64px;text-align:right;font-family:var(--mono)"></span>
    </div>
    <div class="stats">
      <div class="stat"><small>tick</small><b id="s-tick">0</b></div>
      <div class="stat"><small>living</small><b id="s-pop">0</b></div>
      <div class="stat"><small>faded</small><b id="s-faded">0</b></div>
      <div class="stat"><small>places</small><b id="s-nodes">0</b></div>
    </div>
    <div class="other" id="big-other" title="The desire of the big Other: what the cosmos as a whole desires and exchanges"></div>
  </header>
  <div id="scroll">
    <div id="selection"></div>
    <div class="tabs">
      <button id="tab-chronicle" class="on">Chronicle</button>
      <button id="tab-whispers">Whispers <span id="whisper-count"></span></button>
      <button id="tab-beings">Beings</button>
      <button id="tab-mine" class="signed-in-only" hidden>My being</button>
    </div>
    <div id="tab-body"></div>
  </div>
</aside>
<script>
(() => {
  "use strict";

  // ---------- state ----------
  const RESOURCE_COLORS = {
    bone: "#e8dcc0", blood: "#d9434f", peat_moss: "#7fa83a", tomb_mold: "#86c79a",
    sea_foam: "#7fd6d0", obsidian: "#8b78c9", papyrus: "#d9b56a", lotus_root: "#e88fb8",
    soap_stone: "#9aa7b0", birch_bark: "#cbbf94", uncanny_coal: "#ff7a3a"
  };
  const state = {
    world: null, nodes: new Map(), beings: new Map(), events: [], lastSeq: 0,
    selected: null,            // {kind: "being"|"node", id}
    hover: null,
    beckoning: null,           // being id waiting for a target node
    showBonds: false,
    tab: "chronicle",
    view: { x: 0, y: 0, zoom: 1 },
    display: new Map(),        // being id -> {x, y, vx, vy}
    feedback: null,            // {id, text, good}
    seedDismissed: false,
    me: null,                  // {user, being, csrf_token, ...} from /api/me
  };

  // A static build (GitHub Pages) sets <html data-replay="replay.json"> and plays a recording
  const REPLAY_URL = document.documentElement.dataset.replay;
  const replay = REPLAY_URL ? { data: null, frame: 0, playing: true, fps: 4, eventTicks: [] } : null;
  const REPO_URL = "https://github.com/joedaws/lofi-eldritch-cosmos";

  window.cosmos = state; // handy for poking at the cosmos from the console
  const $ = (id) => document.getElementById(id);
  const canvas = $("cosmos");
  const ctx = canvas.getContext("2d");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pretty = (r) => String(r ?? "").replace(/_/g, " ");
  const hash = (s) => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; };
  const resColor = (r) => RESOURCE_COLORS[r] || "#bbb";
  // only touch the DOM when the markup really changed, so clicks are never lost to a re-render
  const setHTML = (el, html) => { if (el._html !== html) { el._html = html; el.innerHTML = html; } };

  // ---------- api ----------
  async function api(path, body, method) {
    const opts = body === undefined && !method ? {} : {
      method: method || "POST",
      headers: { "Content-Type": "application/json", "x-csrf-token": state.me?.csrf_token || "" },
      body: body === undefined ? undefined : JSON.stringify(body),
    };
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok && res.status !== 409) throw Object.assign(new Error(data.error || res.statusText), { data });
    return { status: res.status, data };
  }

  // who is looking: the signed-in person, their being and the CSRF token for writes
  async function loadMe() {
    if (replay) return;
    try { state.me = (await api("/api/me")).data; } catch (e) { state.me = null; }
    if (state.me?.user) {
      try { state.history = (await api("/api/my/history?limit=12")).data; } catch (e) { state.history = null; }
    }
    state.mineVersion = (state.mineVersion || 0) + 1;
    renderAccount();
  }
  const me = () => state.me?.user || null;
  const isAdmin = () => !!me()?.is_admin;

  function renderAccount() {
    const u = me();
    for (const el of document.querySelectorAll(".admin-only")) el.hidden = !(replay || isAdmin());
    for (const el of document.querySelectorAll(".signed-in-only")) el.hidden = !u;
    if (replay) { $("account").hidden = true; return; }
    setHTML($("account"), u
      ? `<b>${esc(u.display_name)}${u.is_admin ? " · keeper" : ""}</b><a href="/users/settings">Settings</a><form method="post" action="/users/log-out" style="display:inline"><input type="hidden" name="_method" value="delete"><input type="hidden" name="_csrf_token" value="${esc(state.me.csrf_token)}"><button class="linkish">Log out</button></form>`
      : `<b>Watching</b><a href="/users/register">Register</a><a href="/users/log-in">Log in</a>`);
  }

  let polling = false;
  async function poll() {
    if (replay) { if (replay.data) ingest(replayWorld(replay.frame)); return; }
    if (polling) return;
    polling = true;
    try {
      const { data } = await api(`/world?since=${state.lastSeq}`);
      ingest(data);
    } catch (e) {
      banner("The cosmos is unreachable…", 2000);
    } finally {
      polling = false;
    }
  }

  function ingest(world) {
    state.world = world;
    state.nodes = new Map(world.nodes.map((n) => [n.id, n]));
    state.beings = new Map(world.beings.map((b) => [b.id, b]));
    if (world.replaceEvents) {
      state.events = world.events;
    } else if (world.events.length) {
      state.lastSeq = world.events[0].seq;
      state.events = world.events.concat(state.events).slice(0, 250);
    }
    for (const id of state.display.keys()) if (!state.beings.has(id)) state.display.delete(id);
    if (state.selected && !(state.selected.kind === "being" ? state.beings : state.nodes).has(state.selected.id)) state.selected = null;
    layoutNodes();
    renderPanel();
    const empty = world.nodes.length === 0;
    $("genesis").style.display = !replay && isAdmin() && ((empty && !state.seedDismissed) || state.forceGenesis) ? "grid" : "none";
  }

  // ---------- replay ----------
  async function loadReplay() {
    try {
      const res = await fetch(REPLAY_URL);
      const R = await res.json();
      // bonds are only stored every few frames: carry the last known bonds forward
      const last = new Map();
      for (const f of R.frames) for (const row of f.b) {
        if (row[8] !== null) {
          const bonds = {};
          for (let i = 0; i < row[8].length; i += 2) { const other = R.beings[row[8][i]]; if (other) bonds[other.id] = row[8][i + 1]; }
          last.set(row[0], bonds);
        }
        row.bonds = last.get(row[0]) || {};
      }
      R.events.sort((a, b) => a.seq - b.seq);
      replay.eventTicks = R.events.map((e) => e.tick);
      replay.data = R;
      setupReplayControls();
      ingest(replayWorld(0));
    } catch (e) {
      banner("Could not load the recording.", 0);
    }
  }

  function replayWorld(i) {
    const R = replay.data, f = R.frames[i], S = R.strings;
    const nodes = R.nodes.map((n, j) => ({
      id: n.id, name: n.name, resource_type: n.resource_type, resource_yield: n.resource_yield,
      max_reserve: n.max_reserve, position: n.position, reserve: f.r[j],
      neighbors: n.neighbors.map((k) => R.nodes[k].id), occupants: [],
    }));
    let population = 0;
    const beings = f.b.map((row) => {
      const info = R.beings[row[0]];
      const node = row[2] >= 0 ? nodes[row[2]] : null;
      const faded = row[3] === 1;
      if (!faded) { population++; if (node) node.occupants.push(info.id); }
      const resources = {};
      for (let k = 0; k < row[7].length; k += 2) resources[S[row[7][k]]] = row[7][k + 1];
      return {
        id: info.id, name: info.name, status: faded ? "faded" : "alive", ichor: row[1], max_ichor: R.meta.max_ichor,
        at_node: node ? node.id : null, resources, desire: S[row[6]], intent: S[row[4]], thought: S[row[5]],
        bonds: row.bonds, known_nodes: row[9], visited_nodes: row[10],
        lineage: { generation: info.generation, parents: info.parents, age_ms: row[11] * 1000, lifespan_ms: info.lifespan ? info.lifespan * 1000 : null },
        incantation: { front: info.front, has_back: info.has_back, box: row[12], awaiting: row[13] === 1, streak: row[14], due_at: null },
        psyche: row.length > 15 ? {
          lack: row[15], jouissance: row[16],
          registers: { real: row[17] / 1000, symbolic: row[18] / 1000, imaginary: row[19] / 1000 },
          unknotted: row[20] >= 0 ? S[row[20]] : null,
          identification: row[21] >= 0 && R.beings[row[21]] ? R.beings[row[21]].id : null,
          symptom: row[22] >= 0 ? { node: R.nodes[row[22]].id, cause: S[row[23]] } : null,
          reason: S[row[24]], chain: row[25].map((k) => S[k]), objet_a: S[row[26]],
        } : null,
      };
    });
    // events up to this tick, most recent first
    let hi = 0; while (hi < replay.eventTicks.length && replay.eventTicks[hi] <= f.t) hi++;
    const events = R.events.slice(Math.max(0, hi - 250), hi).reverse();
    const big_other = {};
    for (let k = 0; k < (f.o || []).length; k += 2) big_other[S[f.o[k]]] = f.o[k + 1] / 100;
    return {
      nodes, beings, events, replaceEvents: true, resources: R.meta.resources, big_other,
      simulation: { running: replay.playing, tick: f.t, tick_ms: Math.round(1000 / replay.fps), population, faded: beings.length - population, now: f.now },
    };
  }

  function setupReplayControls() {
    const R = replay.data;
    $("new-cosmos").style.display = "none";
    $("toggle").title = "Play / pause the recording";
    const speed = $("speed");
    speed.min = 1; speed.max = 20; speed.step = 1; speed.value = replay.fps;
    speed.setAttribute("aria-label", "Playback speed");
    const scrub = document.createElement("div");
    scrub.className = "scrub";
    scrub.innerHTML = `<span style="min-width:0;text-align:left">time</span><input type="range" id="scrub" min="0" max="${R.frames.length - 1}" value="0" aria-label="Replay position"><span id="scrub-label"></span>`;
    document.querySelector(".speed").after(scrub);
    $("scrub").addEventListener("input", (e) => { replay.frame = Number(e.target.value); poll(); });
    document.querySelector(".hint").textContent = "recorded replay · drag to pan · scroll to zoom · click a being or a place";
  }

  // ---------- layout ----------
  function layoutNodes() {
    const list = [...state.nodes.values()];
    list.forEach((n, i) => {
      if (n.position && typeof n.position.x === "number") { n.wx = n.position.x; n.wy = n.position.y; }
      else { const a = hash(n.id) * Math.PI * 2; const r = 1.15 + 0.1 * hash(n.id + "r"); n.wx = Math.cos(a) * r; n.wy = Math.sin(a) * r; }
    });
  }

  function scale() { return Math.min(canvas.clientWidth, canvas.clientHeight) * 0.42 * state.view.zoom; }
  function toScreen(wx, wy) {
    const s = scale();
    return [canvas.clientWidth / 2 + (wx - state.view.x) * s, canvas.clientHeight / 2 + (wy - state.view.y) * s];
  }
  function toWorld(sx, sy) {
    const s = scale();
    return [(sx - canvas.clientWidth / 2) / s + state.view.x, (sy - canvas.clientHeight / 2) / s + state.view.y];
  }

  function beingTarget(b, t) {
    const n = state.nodes.get(b.at_node);
    if (!n) { const a = hash(b.id) * 6.28; return [Math.cos(a) * 1.3, Math.sin(a) * 1.3]; }
    const occupants = b.status === "faded" ? null : n.occupants;
    const phase = hash(b.id) * Math.PI * 2;
    const orbit = (b.status === "faded" ? 0.035 : 0.055 + 0.02 * hash(b.id + "o")) * Math.min(1.6, Math.max(1, Math.sqrt((occupants?.length || 1) / 3)));
    const speed = b.status === "faded" ? 0 : 0.25 + 0.2 * hash(b.id + "s");
    const a = phase + t * speed;
    return [n.wx + Math.cos(a) * orbit, n.wy + Math.sin(a) * orbit];
  }

  function beingRadius(b) {
    const s = Math.max(0.6, Math.min(1.3, state.view.zoom));
    return (4 + 6 * Math.sqrt(Math.max(0, b.ichor) / (b.max_ichor || 200))) * s;
  }

  function nodeRadius(n) { return (10 + 3 * (n.resource_yield || 1) / 3) * Math.max(0.6, Math.min(1.6, state.view.zoom)); }

  // ---------- drawing ----------
  const stars = Array.from({ length: 160 }, (_, i) => ({ x: hash("x" + i), y: hash("y" + i), r: hash("r" + i) * 1.2 + 0.2, p: hash("p" + i) * 6 }));

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);

  function draw(now) {
    const t = now / 1000;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    ctx.clearRect(0, 0, W, H);

    // background
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, "#10201f"); g.addColorStop(1, "#050a0b");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      ctx.globalAlpha = 0.25 + 0.25 * Math.sin(t * 0.7 + s.p);
      ctx.fillStyle = "#d9d0b4";
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // concentric rings, faint
    const rings = new Set([...state.nodes.values()].map((n) => Math.round(Math.hypot(n.wx, n.wy) * 100) / 100).filter((r) => r > 0.01));
    ctx.strokeStyle = "#d9d0b40d"; ctx.lineWidth = 1;
    for (const r of rings) { const [cx, cy] = toScreen(0, 0); ctx.beginPath(); ctx.arc(cx, cy, r * scale(), 0, 6.283); ctx.stroke(); }

    // edges
    ctx.lineWidth = 1.2;
    for (const n of state.nodes.values()) {
      const [x1, y1] = toScreen(n.wx, n.wy);
      for (const id of n.neighbors) {
        if (id < n.id) continue;
        const m = state.nodes.get(id); if (!m) continue;
        const [x2, y2] = toScreen(m.wx, m.wy);
        const sel = state.selected && state.selected.kind === "node" && (state.selected.id === n.id || state.selected.id === m.id);
        ctx.strokeStyle = sel ? "#e2b85acc" : "#b8c4a82a";
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
    }

    // nodes
    for (const n of state.nodes.values()) {
      const [x, y] = toScreen(n.wx, n.wy);
      const r = nodeRadius(n);
      const col = resColor(n.resource_type);
      const frac = n.max_reserve ? Math.max(0, Math.min(1, n.reserve / n.max_reserve)) : 0;
      const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 2.6);
      glow.addColorStop(0, col + "55"); glow.addColorStop(1, col + "00");
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#0d0b18"; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      ctx.fillStyle = col; ctx.globalAlpha = 0.25 + 0.75 * frac;
      ctx.beginPath(); ctx.arc(x, y, r * (0.35 + 0.55 * frac), 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + frac * 6.283); ctx.stroke();
      const isSel = state.selected && state.selected.kind === "node" && state.selected.id === n.id;
      const isHover = state.hover && state.hover.kind === "node" && state.hover.id === n.id;
      if (isSel || isHover || state.beckoning) {
        ctx.strokeStyle = isSel ? "#ffffff" : "#ffffff66"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 6.283); ctx.stroke();
      }
      if (state.view.zoom > 1.4 || isSel || isHover) {
        ctx.fillStyle = "#d9d0b4cc"; ctx.font = "15px VT323, monospace"; ctx.textAlign = "center";
        ctx.fillText(n.name, x, y + r + 14);
      }
    }

    // being positions (smoothed)
    const pos = new Map();
    for (const b of state.beings.values()) {
      const [tx, ty] = beingTarget(b, t);
      let d = state.display.get(b.id);
      if (!d) { d = { x: tx, y: ty }; state.display.set(b.id, d); }
      const k = 0.06;
      d.vx = (tx - d.x) * k; d.vy = (ty - d.y) * k;
      d.x += d.vx; d.y += d.vy;
      pos.set(b.id, toScreen(d.x, d.y));
    }

    // bonds
    const selBeing = state.selected && state.selected.kind === "being" ? state.beings.get(state.selected.id) : null;
    const drawBond = (a, bId, aff) => {
      const p1 = pos.get(a.id), p2 = pos.get(bId); if (!p1 || !p2) return;
      ctx.strokeStyle = aff >= 0 ? `rgba(126,240,200,${Math.min(0.8, 0.15 + aff / 40)})` : `rgba(255,107,122,${Math.min(0.8, 0.2 - aff / 25)})`;
      ctx.lineWidth = 1 + Math.min(3, Math.abs(aff) / 12);
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]);
      const mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2 - 20;
      ctx.quadraticCurveTo(mx, my, p2[0], p2[1]); ctx.stroke();
    };
    if (state.showBonds) {
      for (const b of state.beings.values()) for (const [id, aff] of Object.entries(b.bonds)) if (aff >= 12 && id > b.id) drawBond(b, id, aff);
    }
    if (selBeing) for (const [id, aff] of Object.entries(selBeing.bonds)) if (Math.abs(aff) >= 3) drawBond(selBeing, id, aff);

    // beings
    for (const b of state.beings.values()) {
      const p = pos.get(b.id); if (!p) continue;
      const [x, y] = p;
      const r = beingRadius(b);
      const faded = b.status === "faded";
      const hue = Math.floor(hash(b.id) * 360);
      const body = faded ? "rgba(150,145,170,0.35)" : `hsl(${hue} 70% ${55 + 10 * Math.sin(t + hash(b.id) * 9)}%)`;
      const isSel = selBeing && selBeing.id === b.id;

      if (b.incantation && b.incantation.awaiting) {
        const pulse = 0.5 + 0.5 * Math.sin(t * 4 + hash(b.id) * 6);
        ctx.strokeStyle = `rgba(255,207,107,${0.35 + 0.5 * pulse})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, r + 5 + 3 * pulse, 0, 6.283); ctx.stroke();
      }
      if (!faded) {
        const aura = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
        aura.addColorStop(0, `hsla(${hue},80%,60%,0.35)`); aura.addColorStop(1, `hsla(${hue},80%,60%,0)`);
        ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, 6.283); ctx.fill();
      }
      // wobbling body with tendrils
      ctx.fillStyle = body;
      ctx.beginPath();
      const lobes = 3 + Math.floor(hash(b.id + "l") * 4);
      for (let i = 0; i <= 24; i++) {
        const a = (i / 24) * 6.283;
        const wob = faded ? 0.05 : b.psyche && b.psyche.unknotted ? 0.32 : 0.18;
        const rr = r * (1 + wob * Math.sin(lobes * a + t * (faded ? 0.5 : 2.2) + hash(b.id) * 20));
        const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      if (isSel) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke(); }
      if (b.mine) {
        // your own being wears a small dashed frame
        ctx.save(); ctx.setLineDash([3, 3]); ctx.strokeStyle = "#e2b85a"; ctx.lineWidth = 1.2;
        ctx.strokeRect(x - r - 6, y - r - 6, 2 * r + 12, 2 * r + 12); ctx.restore();
      }
      // eye looking where it moves
      const d = state.display.get(b.id) || { vx: 0, vy: 0 };
      const look = Math.hypot(d.vx, d.vy) > 1e-5 ? Math.atan2(d.vy, d.vx) : hash(b.id) * 6.28;
      const er = Math.max(1.6, r * 0.38);
      ctx.fillStyle = faded ? "#2a2738" : "#f6f1ff";
      ctx.beginPath(); ctx.arc(x, y, er, 0, 6.283); ctx.fill();
      if (!faded) {
        ctx.fillStyle = "#120a22";
        ctx.beginPath(); ctx.arc(x + Math.cos(look) * er * 0.4, y + Math.sin(look) * er * 0.4, er * 0.5, 0, 6.283); ctx.fill();
      }
      if (isSel || (state.hover && state.hover.kind === "being" && state.hover.id === b.id)) {
        ctx.fillStyle = "#f2ead3"; ctx.font = "16px VT323, monospace"; ctx.textAlign = "center";
        ctx.fillText(b.name, x, y - r - 9);
      }
    }
    state.screenPos = pos;

    // camera follows the selected being
    if (state.follow) {
      const d = state.display.get(state.follow);
      if (d && state.beings.has(state.follow)) {
        state.view.x += (d.x - state.view.x) * 0.08;
        state.view.y += (d.y - state.view.y) * 0.08;
      } else state.follow = null;
    }
    requestAnimationFrame(draw);
  }

  // ---------- interaction ----------
  function pick(sx, sy) {
    let best = null, bestD = Infinity;
    if (state.screenPos) for (const [id, [x, y]] of state.screenPos) {
      const b = state.beings.get(id); if (!b) continue;
      const d = Math.hypot(sx - x, sy - y);
      if (d < beingRadius(b) + 6 && d < bestD) { best = { kind: "being", id }; bestD = d; }
    }
    if (best && !state.beckoning) return best;
    best = null; bestD = Infinity;
    for (const n of state.nodes.values()) {
      const [x, y] = toScreen(n.wx, n.wy);
      const d = Math.hypot(sx - x, sy - y);
      if (d < nodeRadius(n) + 6 && d < bestD) { best = { kind: "node", id: n.id }; bestD = d; }
    }
    return best;
  }

  let drag = null;
  canvas.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, vx: state.view.x, vy: state.view.y, moved: false };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.hypot(dx, dy) > 4) { drag.moved = true; state.follow = null; canvas.classList.add("dragging"); }
      if (drag.moved) { state.view.x = drag.vx - dx / scale(); state.view.y = drag.vy - dy / scale(); }
      return;
    }
    state.hover = pick(sx, sy);
    const tip = $("tooltip");
    if (state.hover) {
      const ent = state.hover.kind === "being" ? state.beings.get(state.hover.id) : state.nodes.get(state.hover.id);
      tip.innerHTML = state.hover.kind === "being"
        ? `<b>${esc(ent.name)}</b> · ${esc(ent.status === "faded" ? "faded" : ent.intent)}<br><span style="color:var(--muted)">ichor ${ent.ichor} · lack ${ent.psyche?.lack ?? "?"} · longs for ${esc(pretty(ent.desire))}</span>`
        : `<b>${esc(ent.name)}</b><br><span style="color:var(--muted)">${esc(pretty(ent.resource_type))} · reserve ${ent.reserve} · ${ent.occupants.length} present</span>`;
      tip.style.left = sx + "px"; tip.style.top = sy + "px"; tip.style.display = "block";
    } else tip.style.display = "none";
  });
  canvas.addEventListener("pointerup", async (e) => {
    canvas.classList.remove("dragging");
    const wasDrag = drag && drag.moved; drag = null;
    if (wasDrag) return;
    const rect = canvas.getBoundingClientRect();
    const hit = pick(e.clientX - rect.left, e.clientY - rect.top);
    if (state.beckoning) {
      const beingId = state.beckoning;
      setBeckon(null);
      if (hit && hit.kind === "node") {
        try { await api("/being/beckon", { id: beingId, node_id: hit.id }); banner("The being heeds your call.", 1500); loadMe(); poll(); }
        catch (err) { banner(err.message, 2000); }
      }
      return;
    }
    select(hit);
  });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const [wx, wy] = toWorld(sx, sy);
    state.view.zoom = Math.max(0.4, Math.min(6, state.view.zoom * Math.exp(-e.deltaY * 0.0015)));
    const [wx2, wy2] = toWorld(sx, sy);
    state.view.x += wx - wx2; state.view.y += wy - wy2;
  }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { setBeckon(null); select(null); }
  });

  function select(sel) {
    state.selected = sel;
    state.follow = sel && sel.kind === "being" ? sel.id : null;
    state.feedback = null;
    renderPanel(true);
  }

  function setBeckon(id) {
    state.beckoning = id;
    canvas.classList.toggle("beckoning", !!id);
    if (id) banner("Click a place to beckon the being there (Esc to cancel)");
    else hideBanner();
  }

  let bannerTimer;
  function banner(text, ms) {
    const el = $("banner"); el.textContent = text; el.style.display = "block";
    clearTimeout(bannerTimer);
    if (ms) bannerTimer = setTimeout(hideBanner, ms);
  }
  function hideBanner() { $("banner").style.display = "none"; }

  // ---------- panel ----------
  function nameOf(id) { const b = state.beings.get(id); return b ? b.name : "a forgotten being"; }
  function beingLink(id) { return `<a class="link" data-being="${esc(id)}">${esc(nameOf(id))}</a>`; }
  function nodeLink(id) { const n = state.nodes.get(id); return n ? `<a class="link" data-node="${esc(id)}">${esc(n.name)}</a>` : "nowhere"; }
  function fmtDue(ms) {
    const s = Math.max(0, Math.round((ms - (state.world?.simulation?.now ?? Date.now())) / 1000));
    if (s < 60) return `${s}s`; if (s < 3600) return `${Math.round(s / 60)}m`; if (s < 86400) return `${Math.round(s / 3600)}h`; return `${Math.round(s / 86400)}d`;
  }

  function fmtMs(ms) {
    const s = Math.ceil(ms / 1000);
    if (s < 60) return `${s}s`; if (s < 3600) return `${Math.ceil(s / 60)} min`;
    if (s < 86400) return `${Math.round(s / 360) / 10} h`; return `${Math.round(s / 8640) / 10} days`;
  }

  function renderStats() {
    const sim = state.world?.simulation || {};
    $("s-tick").textContent = sim.tick ?? 0;
    $("s-pop").textContent = `${sim.population ?? 0}`;
    $("s-faded").textContent = sim.faded ?? 0;
    $("s-nodes").textContent = state.nodes.size;
    $("toggle").textContent = replay ? (replay.playing ? "❚❚ Pause" : "▶ Play") : sim.running ? "❚❚ Slumber" : "▶ Stir";
    $("toggle").classList.toggle("primary", !sim.running);
    const speed = $("speed");
    if (replay) {
      $("speed-label").textContent = `${replay.fps} frames/s`;
      if (replay.data) {
        if (document.activeElement !== $("scrub")) $("scrub").value = replay.frame;
        $("scrub-label").textContent = `tick ${sim.tick} / ${replay.data.meta.ticks}`;
      }
    } else {
      if (document.activeElement !== speed && sim.tick_ms) speed.value = 3100 - sim.tick_ms;
      $("speed-label").textContent = `${sim.tick_ms ?? "?"}ms/tick`;
    }
    $("bonds-toggle").classList.toggle("primary", state.showBonds);
    const other = Object.entries(state.world?.big_other || {}).sort((a, b) => b[1] - a[1]).slice(0, 4);
    setHTML($("big-other"), other.length ? `<span>the Other desires</span>${other.map(([r]) => `<span class="chip"><span class="dot" style="background:${resColor(r)}"></span>${esc(pretty(r))}</span>`).join("")}` : "");
    setHTML($("legend"), `<div class="chips">${(state.world?.resources || []).map((r) => `<span class="chip"><span class="dot" style="background:${resColor(r)}"></span>${esc(pretty(r))}</span>`).join("")}</div>`);
  }

  // never re-render the side panel under a pressed pointer: the click would be lost
  let panelFrozen = false;
  document.querySelector("aside").addEventListener("pointerdown", () => { panelFrozen = true; });
  window.addEventListener("pointerup", () => setTimeout(() => { panelFrozen = false; }, 0));

  function renderPanel(force) {
    renderStats();
    if (panelFrozen && !force) return;
    const sel = $("selection");
    // don't clobber an input the user is typing into
    const active = document.activeElement;
    if (!force && active && sel.contains(active) && active.tagName === "INPUT") { renderTab(); return; }
    if (!state.selected) {
      const notice = replay ? `<div class="card notice"><b>This is a recording.</b> ${replay.data ? replay.data.meta.ticks : ""} ticks of a cosmos simulated offline, with a pretend player answering some incantations. Scrub through time, pause, and click beings and places to inspect them. To answer incantations, beckon beings and summon your own, <a href="${REPO_URL}" target="_blank" rel="noopener">run the cosmos locally</a>.</div>` : "";
      const invite = replay ? "" : !me()
        ? `<div class="empty"><a class="link" href="/users/register">Register</a> to summon a being of your own and keep it alive with your remembering.</div>`
        : !state.me.being ? `<div class="empty">You have no being yet. Open <a class="link" data-tab="mine">My being</a> to summon one.</div>` : "";
      setHTML(sel, notice + `<div class="card"><div class="thought">Beings roam a landscape of haunted places, gathering what they desire, meeting, gifting, quarrelling and summoning new beings. Each holds a deck of incantations; answer them when they are whispered to strengthen the being, even to call it back from the void.</div><div class="empty">Select a being or a place.</div>${invite}</div>`);
    } else if (state.selected.kind === "being") {
      setHTML(sel, beingCard(state.beings.get(state.selected.id)));
    } else {
      setHTML(sel, nodeCard(state.nodes.get(state.selected.id)));
    }
    renderTab();
  }

  // the being's psyche (see Eldritch.Lacan)
  function psycheSection(b) {
    const p = b.psyche;
    if (!p) return "";
    const regs = [["real", "Real", "var(--danger)"], ["symbolic", "Symbolic", "var(--accent-2)"], ["imaginary", "Imaginary", "var(--warn)"]];
    const symptom = p.symptom ? `<div class="row"><span>symptom</span><span>drawn back to ${nodeLink(p.symptom.node)}: ${esc(p.symptom.cause)}</span></div>` : "";
    return `<h3>Psyche${p.unknotted ? ` · <span style="color:var(--warn)">knot loosened (${esc(p.unknotted)})</span>` : ""}</h3>
      <div class="row"><span>lack</span><span>${p.lack}${p.jouissance >= 5 ? ` · jouissance ${p.jouissance}` : ""}</span></div>
      <div class="bar"><i style="width:${p.lack}%;background:var(--accent)"></i></div>
      <div class="registers">${regs.map(([k, label, col]) => `<span class="${p.unknotted === k ? "loose" : ""}">${label}</span><div class="bar"><i style="width:${Math.round(100 * (p.registers?.[k] || 0))}%;background:${col}"></i></div><span>${Math.round(100 * (p.registers?.[k] || 0))}%</span>`).join("")}</div>
      <div class="row" style="margin-top:6px"><span>cause of desire</span>${p.objet_a ? `<span class="chip" title="objet petit a: never desired directly; too much of it brings anxiety"><span class="dot" style="background:${resColor(p.objet_a)}"></span>${esc(pretty(p.objet_a))} (objet a)</span>` : `<span class="chip" title="revealed only when the being is seized by anxiety">hidden (objet a)</span>`}</div>
      ${p.identification ? `<div class="row"><span>mirrors</span><span>${beingLink(p.identification)}</span></div>` : ""}
      ${symptom}
      ${(p.chain || []).some((r) => r !== b.desire) ? `<div class="row"><span>chain</span><span class="chain">${[b.desire, ...new Set(p.chain.filter((r) => r !== b.desire))].map((r, i) => `${i ? "←" : ""}<span class="chip"><span class="dot" style="background:${resColor(r)}"></span>${esc(pretty(r))}</span>`).join("")}</span></div>` : ""}`;
  }

  function beingCard(b) {
    if (!b) return "";
    const pct = Math.round(100 * b.ichor / (b.max_ichor || 200));
    const ichorCol = b.ichor < 30 ? "var(--danger)" : b.ichor < 80 ? "var(--warn)" : "var(--accent-2)";
    const res = Object.entries(b.resources).sort((a, c) => c[1] - a[1]);
    const bonds = Object.entries(b.bonds).sort((a, c) => c[1] - a[1]);
    const inc = b.incantation || {};
    const fb = state.feedback && state.feedback.id === b.id ? `<div class="feedback ${state.feedback.good ? "good" : "bad"}">${esc(state.feedback.text)}</div>` : "";
    const lin = b.lineage || {};
    return `<div class="card">
      <div class="row"><h2>${esc(b.name)}</h2><span class="chip">${b.status === "faded" ? "faded" : esc(b.intent || "")}</span></div>
      <div class="thought">“${esc(b.thought || "…")}”</div>
      <div class="row"><span>ichor</span><span>${b.ichor} / ${b.max_ichor}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${ichorCol}"></i></div>
      <div class="row"><span>belongs to</span><span>${b.mine ? '<span class="mine-mark">you</span>' : b.owner ? esc(b.owner) : "the commons"}</span></div>
      <div class="row"><span>dwells at</span><span>${nodeLink(b.at_node)}</span></div>
      <div class="row"><span>longs for</span><span class="chip desire"><span class="dot" style="background:${resColor(b.desire)}"></span>${esc(pretty(b.desire))}</span></div>
      ${b.psyche?.reason ? `<div class="reason">because ${esc(b.psyche.reason)}</div>` : ""}
      <div class="row"><span>knows</span><span>${b.known_nodes} places · visited ${b.visited_nodes}</span></div>
      <div class="row"><span>lineage</span><span>generation ${lin.generation ?? 0} · age ${fmtMs(lin.age_ms || 0)}${lin.lifespan_ms ? ` of ${fmtMs(lin.lifespan_ms)}` : ""}</span></div>
      ${lin.grace_left_ms != null ? `<div class="row"><span>vitality</span><span>${lin.withering ? '<span style="color:var(--danger)">withering: its owner has not answered it</span>' : `kept by its owner's remembering · ${fmtMs(lin.grace_left_ms)} of grace left`}</span></div>` : lin.withering ? '<div class="row"><span>vitality</span><span style="color:var(--danger)">ancient, withering</span></div>' : ""}
      ${(lin.parents || []).length ? `<div class="row"><span>summoned by</span><span>${lin.parents.map(beingLink).join(" & ")}</span></div>` : ""}
      ${psycheSection(b)}
      <h3>Carries</h3>
      <div class="chips">${res.length ? res.map(([r, n]) => `<span class="chip"><span class="dot" style="background:${resColor(r)}"></span>${n} ${esc(pretty(r))}</span>`).join("") : '<span class="empty">nothing</span>'}</div>
      <h3>Bonds</h3>
      <div class="chips">${bonds.length ? bonds.slice(0, 12).map(([id, a]) => `<span class="chip" style="border-color:${a >= 0 ? "var(--accent-2)" : "var(--danger)"};color:${a >= 0 ? "var(--ink)" : "var(--danger)"}">${beingLink(id)} ${a > 0 ? "+" : ""}${a}</span>`).join("") : '<span class="empty">a stranger to all</span>'}</div>
      <h3>Incantation${b.deck_size > 1 ? ` · ${b.deck_size} cards` : ""} · box ${inc.box ?? 1}${inc.streak ? ` · streak ${inc.streak}` : ""}</h3>
      <div class="incantation ${inc.awaiting ? "awaiting" : ""}">${inc.front == null ? "<span style=\"color:var(--muted)\">Its words are for its owner alone.</span>" : esc(inc.front || "—")}</div>
      ${replay
        ? `<div class="feedback" style="color:var(--muted)">${inc.awaiting ? "It is whispering, waiting for an answer." : "It will whisper again in time."}</div>`
        : inc.awaiting && !b.can_answer
        ? `<div class="feedback" style="color:var(--muted)">It is whispering. ${me() ? "Only its owner can answer." : "Log in to answer the whispers of the commons."}</div>`
        : inc.awaiting
        ? `<form class="recall" data-recall="${esc(b.id)}"><input type="text" name="answer" placeholder="${inc.has_back ? "Speak the answer…" : "Acknowledge it (any word)"}" autocomplete="off"><button class="primary">Answer</button></form>`
        : `<div class="feedback" style="color:var(--muted)">It will whisper again in ${fmtDue(inc.due_at)}.</div>`}
      ${fb}
      ${beckonControls(b)}
      <form class="form-grid" data-rebind="${esc(b.id)}" style="display:${state.editing === b.id ? "grid" : "none"}">
        <input type="text" name="front" placeholder="Front (the question)" required>
        <input type="text" name="back" placeholder="Back (answer — leave empty for a declaration)">
        <button class="primary">Bind</button>
      </form>
    </div>`;
  }

  // owners beckon their own being now and then; the keeper may beckon anyone
  function beckonControls(b) {
    if (replay || !me()) return "";
    const wait = b.mine ? (b.beckon_wait_ms || 0) : 0;
    const may = b.mine || isAdmin();
    if (!may) return "";
    return `<div class="controls" style="margin-top:12px">
      <button data-beckon="${esc(b.id)}" ${b.status === "faded" || wait > 0 ? "disabled" : ""}>Beckon…</button>
      ${wait > 0 ? `<span class="feedback" style="color:var(--muted)">It will heed you again in ${fmtMs(wait)}.</span>` : b.mine ? `<span class="feedback" style="color:var(--muted)">Once every ${fmtMs(state.me.beckon_cooldown_ms)}.</span>` : ""}
      ${isAdmin() && !b.mine ? `<button data-edit="${esc(b.id)}">Rebind incantation</button>` : ""}
    </div>`;
  }

  function nodeCard(n) {
    if (!n) return "";
    const pct = n.max_reserve ? Math.round(100 * n.reserve / n.max_reserve) : 0;
    const present = n.occupants.filter((id) => state.beings.has(id));
    const remains = [...state.beings.values()].filter((b) => b.status === "faded" && b.at_node === n.id);
    return `<div class="card">
      <h2>${esc(n.name)}</h2>
      <div class="row" style="margin-top:8px"><span>resource</span><span class="chip"><span class="dot" style="background:${resColor(n.resource_type)}"></span>${esc(pretty(n.resource_type))} · yields ${n.resource_yield}</span></div>
      <div class="row"><span>reserve</span><span>${n.reserve} / ${n.max_reserve}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${resColor(n.resource_type)}"></i></div>
      <h3>Present (${present.length})</h3>
      <div class="chips">${present.length ? present.map((id) => `<span class="chip">${beingLink(id)}</span>`).join("") : '<span class="empty">no one</span>'}</div>
      ${remains.length ? `<h3>Remains of the faded</h3><div class="chips">${remains.map((b) => `<span class="chip">${beingLink(b.id)}</span>`).join("")}</div>` : ""}
      <h3>Paths lead to</h3>
      <div class="chips">${n.neighbors.map((id) => `<span class="chip">${nodeLink(id)}</span>`).join("")}</div>
      ${replay || !isAdmin() ? "" : `<h3>Summon a being of the commons here</h3>
      <form class="form-grid" data-summon="${esc(n.id)}">
        <input type="text" name="name" placeholder="Name (optional)">
        <input type="text" name="front" placeholder="Incantation front, e.g. 'capital of Peru'">
        <input type="text" name="back" placeholder="Incantation back, e.g. 'Lima'">
        <button class="primary">Summon</button>
      </form>`}
    </div>`;
  }

  function renderTab() {
    if (panelFrozen) return;
    for (const t of ["chronicle", "whispers", "beings", "mine"]) $("tab-" + t).classList.toggle("on", state.tab === t);
    // only the whispers you may answer
    const whispering = [...state.beings.values()].filter((b) => b.incantation && b.incantation.awaiting && (replay || b.can_answer));
    $("whisper-count").textContent = whispering.length ? `(${whispering.length})` : "";
    const body = $("tab-body");
    const lastTab = body._tab; body._tab = state.tab;
    if (lastTab === "mine" && state.tab !== "mine") body._mineVersion = null;
    if (body.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
    if (state.tab === "chronicle") {
      setHTML(body, state.events.length
        ? `<ul class="events">${state.events.slice(0, 80).map((e) => `<li class="${esc(e.kind)}" ${e.beings && e.beings[0] ? `data-being="${esc(e.beings[0])}" style="cursor:pointer"` : ""}><span class="k">${esc(e.kind)} · ${e.tick}</span>${esc(e.text)}</li>`).join("")}</ul>`
        : '<div class="empty">Nothing has happened yet. Stir the cosmos.</div>');
    } else if (state.tab === "whispers") {
      setHTML(body, whispering.length
        ? `<ul class="events whispers">${whispering.map((b) => `<li data-being="${esc(b.id)}" style="cursor:pointer"><span>${esc(b.name)}${b.status === "faded" ? " (faded)" : ""}</span><span style="font-family:var(--sans)">${esc(b.incantation.front)}</span></li>`).join("")}</ul>`
        : `<div class="empty">${replay || me() ? "No being you may answer is whispering." : "Log in to answer whispers."} Incantations come due over time (20s, 1m, 5m, 30m, 2h, 1d as they climb the boxes).</div>`);
    } else if (state.tab === "mine") {
      // only redraw when your own data changes, so unsaved slider moves are kept
      if (body._mineVersion !== state.mineVersion || body._mineEditing !== state.editingCard || lastTab !== "mine") {
        setHTML(body, myBeingPanel());
        body._mineVersion = state.mineVersion; body._mineEditing = state.editingCard;
      }
    } else {
      const list = [...state.beings.values()].sort((a, b) => (a.status === b.status ? b.ichor - a.ichor : a.status === "faded" ? 1 : -1));
      setHTML(body, list.length
        ? `<ul class="events">${list.map((b) => `<li data-being="${esc(b.id)}" style="cursor:pointer;display:flex;justify-content:space-between;gap:8px"><span>${esc(b.name)}${b.mine ? ' <span class="mine-mark">(yours)</span>' : b.owner ? ` <span style="color:var(--faint)">· ${esc(b.owner)}</span>` : ""}</span><span style="color:var(--muted)">${b.status === "faded" ? "faded" : `${b.ichor} ichor · ${esc(b.intent)}`}</span></li>`).join("")}</ul>`
        : '<div class="empty">No beings exist.</div>');
    }
  }

  // ---------- my being ----------
  const TRAITS = [
    ["generosity", "Generosity", "how readily it gives when others make demands"],
    ["wanderlust", "Wanderlust", "explore and roam, or stay near what it wants"],
    ["sociability", "Sociability", "how strongly it seeks out beings it is bonded to"],
    ["conformity", "Conformity", "follow what the cosmos desires, or its own chain"],
  ];

  function myBeingPanel() {
    const mine = state.me?.being;
    if (!mine) {
      const places = [...state.nodes.values()].sort((a, b) => a.name.localeCompare(b.name));
      return `<div class="card">
        <h2>Summon your being</h2>
        <p class="empty" style="font-style:normal">You may summon one being into the cosmos. It will live by its own will, shaped by its temperament. Give it incantations to whisper: answering them is what keeps it alive.</p>
        <form class="form-grid" data-mine="summon">
          <label for="mb-name">Name (leave empty for one from the grimoire)</label>
          <input type="text" id="mb-name" name="name" maxlength="32">
          <label for="mb-place">Where it awakens</label>
          <select id="mb-place" name="at_node" style="font:inherit;padding:5px;border:1px solid var(--ink);background:var(--putty-3)">
            <option value="">wherever the cosmos chooses</option>
            ${places.map((n) => `<option value="${esc(n.id)}">${esc(n.name)}</option>`).join("")}
          </select>
          <label for="mb-front">Its first incantation</label>
          <input type="text" id="mb-front" name="front" maxlength="200" placeholder="Front, e.g. 'capital of Peru'">
          <input type="text" id="mb-back" name="back" maxlength="200" placeholder="Back, e.g. 'Lima' (empty for a reminder)">
          ${temperamentInputs({})}
          <button class="primary">Summon</button>
        </form>
      </div>`;
    }
    const live = state.beings.get(mine.id);
    const cards = mine.cards || [];
    return `<div class="card">
      <div class="row"><h2>${esc(mine.name)}</h2>${live && live.status === "faded" ? '<span class="chip">faded: answer its whispers to call it back</span>' : ""}</div>
      <div class="row"><span>vitality</span><span>${mine.grace_left_ms > 0 ? `${fmtMs(mine.grace_left_ms)} of grace left` : '<span style="color:var(--danger)">withering: answer its whispers</span>'}</span></div>
      <p class="empty" style="font-style:normal">Each answer you give it restores ${fmtMs(mine.grace_ms)} of grace. Left unanswered longer, it withers and fades; an answer calls it back.</p>
      <div class="controls"><button data-being="${esc(mine.id)}">Find it on the map</button></div>
      <h3>Temperament</h3>
      <form class="form-grid" data-mine="temperament">
        ${temperamentInputs(mine.temperament)}
        <button>Save temperament</button>
      </form>
      <h3>Deck · ${cards.length} / ${state.me.max_cards}</h3>
      <ul class="deck">${cards.map((c) => `<li class="${c.awaiting ? "awaiting" : ""}">
          <span class="front">${esc(c.front)}</span>
          <span class="acts"><button data-card-edit="${esc(c.id)}">Edit</button><button data-card-delete="${esc(c.id)}">Burn</button></span>
          <span class="back">${c.back ? esc(c.back) : "<i>a reminder: any word answers it</i>"}</span>
          <span class="meta">box ${c.box}${c.awaiting ? " · whispering now" : ` · due in ${fmtDue(c.due_at)}`}</span>
          ${state.editingCard === c.id ? `<form class="form-grid" data-mine="edit-card" data-card="${esc(c.id)}" style="grid-column:1/-1">
            <input type="text" name="front" maxlength="200" value="${esc(c.front)}" required>
            <input type="text" name="back" maxlength="200" value="${esc(c.back)}">
            <button class="primary">Rewrite (progress starts over)</button></form>` : ""}
        </li>`).join("") || '<li class="empty">No cards. Your being has nothing to whisper.</li>'}</ul>
      <form class="form-grid" data-mine="add-card" style="margin-top:8px">
        <input type="text" name="front" maxlength="200" placeholder="New card: front" required>
        <input type="text" name="back" maxlength="200" placeholder="Back (empty for a reminder)">
        <button>Add card</button>
      </form>
      ${journal()}
    </div>`;
  }

  // what you have done with your being, and how well you remember
  function journal() {
    const h = state.history;
    if (!h) return "";
    const ago = (at) => fmtMs(Math.max(1000, Date.now() - at)) + " ago";
    const line = (i) => {
      const d = i.data || {};
      switch (i.kind) {
        case "answer": return `<span class="${d.correct ? "ok" : "miss"}">${d.correct ? "✓" : "✗"}</span> “${esc(d.front)}” → ${esc(d.answer || "…")}${d.correct ? "" : ` <span style="color:var(--muted)">(${esc(d.expected)})</span>`}${d.revived ? " · called it back" : ""}`;
        case "summoned": return `summoned ${esc(d.being)} into ${esc(d.place)}`;
        case "card_added": return `added “${esc(d.front)}”`;
        case "card_rewritten": return `rewrote “${esc(d.before?.front)}” as “${esc(d.after?.front)}”`;
        case "card_burned": return `burned “${esc(d.card?.front)}”`;
        case "temperament": return `changed its temperament`;
        case "beckon": return `beckoned it to ${esc(d.place)}`;
        default: return esc(i.kind);
      }
    };
    const cards = (h.cards || []).slice(0, 6);
    return `<h3>Journal</h3>
      ${cards.length ? `<div class="accuracy">${cards.map((c) => `<span class="front" title="${esc(c.front)}">${esc(c.front)}</span><div class="bar"><i style="width:${Math.round(100 * c.right / c.answers)}%;background:var(--accent-2)"></i></div><span>${c.right}/${c.answers}</span>`).join("")}</div>
        <p class="empty" style="font-style:normal;margin:4px 0 8px">Weakest cards first: what you remember least.</p>` : ""}
      <ul class="journal">${(h.interactions || []).map((i) => `<li><span>${line(i)}</span><span class="when">${ago(i.at)}</span></li>`).join("") || '<li class="empty">Nothing yet.</li>'}</ul>
      ${(h.being_events || []).length ? `<h3>What befell it</h3><ul class="journal">${h.being_events.slice(0, 6).map((e) => `<li><span>${esc(e.text)}</span><span class="when">${ago(e.at)}</span></li>`).join("")}</ul>` : ""}
      <p style="margin:10px 0 0;font-size:11.5px"><a class="link" href="/api/my/history/export" download>Download my whole history (.jsonl)</a> — every answer and change, one JSON object per line, for your own tools or a learning agent.</p>`;
  }

  function temperamentInputs(t) {
    return `<div class="temper">${TRAITS.map(([k, label, hint]) => `
      <label for="t-${k}">${label}</label><input type="range" id="t-${k}" name="${k}" min="0" max="100" step="5" value="${t[k] ?? 50}" oninput="this.nextElementSibling.value=this.value"><output>${t[k] ?? 50}</output><small>${hint}</small>`).join("")}</div>`;
  }

  async function mineAction(kind, f, data) {
    if (kind === "summon") {
      const body = { name: data.name || undefined, at_node: data.at_node || undefined, temperament: traitsOf(data) };
      if (data.front) body.cards = [{ front: data.front, back: data.back || "" }];
      const { data: r } = await api("/api/my/being", body);
      await loadMe(); await poll();
      select({ kind: "being", id: r.being_id }); focusOn(r.being_id);
      banner("Your being awakens.", 2500);
    } else if (kind === "temperament") {
      await api("/api/my/temperament", traitsOf(data), "PUT");
      banner("Its temperament is set.", 1500);
    } else if (kind === "add-card") {
      await api("/api/my/cards", { front: data.front, back: data.back || "" });
    } else if (kind === "edit-card") {
      await api(`/api/my/cards/${encodeURIComponent(f.dataset.card)}`, { front: data.front, back: data.back || "" }, "PUT");
      state.editingCard = null;
    }
    await loadMe();
  }

  const traitsOf = (data) => Object.fromEntries(TRAITS.map(([k]) => [k, Number(data[k] ?? 50)]));

  // delegated clicks in the side panel
  document.querySelector("aside").addEventListener("click", (e) => {
    const el = e.target.closest("[data-being],[data-node],[data-beckon],[data-edit],[data-tab],[data-card-edit],[data-card-delete]");
    if (!el) return;
    if (el.dataset.tab) { state.tab = el.dataset.tab; renderTab(); return; }
    if (el.dataset.cardEdit) { state.editingCard = state.editingCard === el.dataset.cardEdit ? null : el.dataset.cardEdit; renderTab(); return; }
    if (el.dataset.cardDelete) {
      api(`/api/my/cards/${encodeURIComponent(el.dataset.cardDelete)}`, undefined, "DELETE").then(loadMe).then(renderTab).catch((err) => banner(err.message, 2500));
      return;
    }
    if (el.dataset.being) { select({ kind: "being", id: el.dataset.being }); focusOn(el.dataset.being); }
    else if (el.dataset.node) { select({ kind: "node", id: el.dataset.node }); focusOn(el.dataset.node); }
    else if (el.dataset.beckon) setBeckon(el.dataset.beckon);
    else if (el.dataset.edit) { state.editing = state.editing === el.dataset.edit ? null : el.dataset.edit; renderPanel(true); }
  });

  function focusOn(id) {
    state.view.zoom = Math.max(state.view.zoom, 1.6);
    const n = state.nodes.get(id);
    // beings are followed by the camera (see draw)
    if (n) { state.view.x = n.wx; state.view.y = n.wy; }
  }

  document.querySelector("aside").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target, data = Object.fromEntries(new FormData(f));
    if (f.getAttribute("action")) { f.submit(); return; } // plain forms (log out)
    try {
      if (f.dataset.mine) {
        await mineAction(f.dataset.mine, f, data);
        document.activeElement && document.activeElement.blur();
        state.tab = "mine"; renderTab();
        return;
      }
      if (f.dataset.recall) {
        const { status, data: r } = await api("/being/recall", { id: f.dataset.recall, answer: data.answer });
        state.feedback = status === 409
          ? { id: f.dataset.recall, good: false, text: "It is not whispering yet." }
          : r.correct
            ? { id: f.dataset.recall, good: true, text: `True! Ichor surges (+${r.ichor_gain}). The incantation rises to box ${r.box}.` }
            : { id: f.dataset.recall, good: false, text: `False. It was “${r.expected}”. The incantation returns to box 1.` };
      } else if (f.dataset.rebind) {
        await api("/being/incantation", { id: f.dataset.rebind, front: data.front, back: data.back });
        state.feedback = { id: f.dataset.rebind, good: true, text: "The incantation is bound." };
        state.editing = null;
      } else if (f.dataset.summon) {
        const body = { at_node: f.dataset.summon };
        if (data.name) body.name = data.name;
        if (data.front) body.incantation = { front: data.front, back: data.back || "" };
        const { data: r } = await api("/being", body);
        await poll();
        select({ kind: "being", id: r.being_id });
      }
      document.activeElement && document.activeElement.blur();
      if (f.dataset.recall) await loadMe();
      await poll();
      renderPanel(true);
    } catch (err) { banner(err.message, 2500); }
  });

  // ---------- header controls ----------
  $("toggle").addEventListener("click", async () => {
    if (replay) { replay.playing = !replay.playing; if (replay.playing && replay.data && replay.frame >= replay.data.frames.length - 1) replay.frame = 0; poll(); schedule(); return; }
    const running = state.world?.simulation?.running;
    await api(running ? "/simulation/stop" : "/simulation/start", {});
    poll();
  });
  $("speed").addEventListener("change", async (e) => {
    if (replay) { replay.fps = Number(e.target.value); renderStats(); schedule(); return; }
    await api("/simulation/speed", { tick_ms: 3100 - Number(e.target.value) });
    poll(); schedule();
  });
  $("bonds-toggle").addEventListener("click", () => { state.showBonds = !state.showBonds; renderStats(); });
  $("new-cosmos").addEventListener("click", () => { state.forceGenesis = true; $("genesis").style.display = "grid"; });
  $("seed-cancel").addEventListener("click", () => { state.forceGenesis = false; state.seedDismissed = true; $("genesis").style.display = "none"; });
  $("seed-go").addEventListener("click", async () => {
    const hasCosmos = state.nodes.size > 0;
    if (hasCosmos && !confirm("Unmake the current cosmos? Every being and place will be destroyed.")) return;
    const rings = $("seed-rings").value.split(",").map((s) => parseInt(s, 10)).filter((n) => n > 0);
    $("seed-go").disabled = true; $("seed-error").textContent = "";
    try {
      await api("/cosmos/seed", { reset: true, beings: Number($("seed-beings").value) || 12, rings });
      state.events = []; state.lastSeq = 0; state.selected = null; state.display.clear();
      state.forceGenesis = false;
      state.view = { x: 0, y: 0, zoom: 1 };
      await api("/simulation/start", {});
      await poll();
    } catch (err) { $("seed-error").textContent = err.message; }
    finally { $("seed-go").disabled = false; }
  });
  for (const t of ["chronicle", "whispers", "beings", "mine"]) $("tab-" + t).addEventListener("click", () => { state.tab = t; renderTab(); });

  // ---------- loop ----------
  let timer;
  function schedule() {
    clearTimeout(timer);
    if (replay) {
      timer = setTimeout(() => {
        if (replay.data && replay.playing) {
          if (replay.frame < replay.data.frames.length - 1) replay.frame++;
          else { replay.frame = 0; state.selected = null; state.follow = null; }
        }
        poll(); schedule();
      }, replay.frame === (replay.data?.frames.length ?? 0) - 1 ? 4000 : 1000 / replay.fps);
      return;
    }
    const tick = state.world?.simulation?.tick_ms || 1000;
    timer = setTimeout(async () => { await poll(); schedule(); }, Math.max(300, Math.min(1000, tick)));
  }
  // refresh countdowns even when nothing changes
  setInterval(() => { if (state.selected && state.selected.kind === "being") renderPanel(); }, 1000);

  resize();
  if (replay) { renderAccount(); loadReplay().then(schedule); }
  else loadMe().then(poll).then(schedule);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
