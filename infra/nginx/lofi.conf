# Nginx site for the Lofi Eldritch Cosmos (Phoenix on 127.0.0.1:4100)
#
# Replace every COSMOS_DOMAIN below with the real domain, then:
#   1. sudo cp infra/nginx/lofi.conf /etc/nginx/sites-available/lofi
#   2. sudo ln -s /etc/nginx/sites-available/lofi /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d COSMOS_DOMAIN
#      (certbot adds the https server block and the http -> https redirect)
#
# Lives beside the wish list's site; nginx picks the site by server_name.

server {
    listen 80;
    listen [::]:80;
    server_name COSMOS_DOMAIN;

    access_log /var/log/nginx/lofi.access.log;
    error_log  /var/log/nginx/lofi.error.log;

    # the page posts small JSON bodies only
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        # websockets (live updates, when they arrive)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
